<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Tailed</title>

<style>
/* ===== BASE BACKGROUND ===== */
body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: #fff;
    overflow: hidden;
    background: radial-gradient(circle at 50% 50%, #05051a, #020014 60%, #000010 100%);
    animation: bgShift 40s ease infinite;
}
@keyframes bgShift { 50% { background-position: 48% 52%; } }

/* ===== TEXT EFFECTS ===== */
.gradient-text {
    background: linear-gradient(45deg, #ffe600, #ffb300, #ff8a00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: textGlow 6s ease infinite;
}
@keyframes textGlow { 50% { background-position: 100% 50%; } }

.neon {
    text-shadow: 0 0 6px #ffdd55, 0 0 12px #ffb300, 0 0 24px #ff8a00, 0 0 48px #ff8a00;
}

/* ===== SLOW-MOVING GALAXY ===== */
.galaxy {
    position: fixed;
    top: -20%;
    left: -20%;
    width: 160%;
    height: 160%;
    background: radial-gradient(circle at 50% 50%, rgba(80,0,255,0.15), transparent 70%),
                radial-gradient(circle at 60% 40%, rgba(150,80,255,0.12), transparent 70%);
    opacity: 0.18;
    animation: galaxyDrift 140s linear infinite;
    z-index: -1;
}
@keyframes galaxyDrift { 100% { transform: translate(120px, -120px); } }

/* ===== HORIZON GLOW ===== */
.horizon-glow {
    position: fixed;
    bottom: -120px;
    left: 0;
    width: 100%;
    height: 300px;
    background: radial-gradient(circle at 50% 0%, rgba(80,0,255,0.4), transparent);
    opacity: 0.45;
    animation: horizonPulse 20s ease-in-out infinite;
    z-index: 0;
}
@keyframes horizonPulse { 50% { opacity: 0.55; } }

/* ===== ASTEROID BELT ===== */
.asteroid-belt {
    position: fixed;
    top: 40%;
    left: -20%;
    width: 140%;
    height: 200px;
    background: radial-gradient(circle, rgba(255,180,0,0.25), transparent 70%);
    opacity: 0.25;
    transform: rotate(-15deg);
    animation: beltDrift 50s linear infinite;
    z-index: 1;
}
@keyframes beltDrift { 100% { transform: rotate(-15deg) translateX(200px); } }

/* ===== THREE CHAOTIC HORIZON MOONS ===== */
.moon {
    position: fixed;
    bottom: 120px;
    width: 180px;
    height: 180px;
    background: radial-gradient(circle, #dcdcff, #6a6aff, #1a1a5f);
    border-radius: 50%;
    box-shadow: 0 0 40px rgba(120,120,255,0.4);
    z-index: 2;
}

/* Moon 1 */
.moon1 { left: 20%; animation: m1 22s linear infinite; }
@keyframes m1 { 50% { transform: translate(40px,-20px); } }

/* Moon 2 */
.moon2 { left: 50%; animation: m2 28s ease-in-out infinite; }
@keyframes m2 {
    40% { transform: translate(-30px,-40px); }
    80% { transform: translate(20px,-10px); }
}

/* Moon 3 */
.moon3 { left: 75%; animation: m3 18s ease infinite; }
@keyframes m3 {
    30% { transform: translate(25px,-30px); }
    60% { transform: translate(-15px,-10px); }
}

/* ===== NEBULA (BEHIND EVERYTHING) ===== */
.nebula {
    position: fixed;
    top: 0; left: 0;
    width: 200%; height: 200%;
    background-repeat: no-repeat;
    background-size: cover;
    opacity: 0.25;
    animation: nebulaDrift 80s linear infinite;
    z-index: -2;
}
@keyframes nebulaDrift { 100% { transform: translate(6%,6%); } }

.n1 { background-image: radial-gradient(circle at 30% 70%, rgba(255,150,0,0.35), transparent); animation-duration: 110s; }
.n2 { background-image: radial-gradient(circle at 70% 40%, rgba(255,80,0,0.3), transparent); animation-duration: 80s; }
.n3 { background-image: radial-gradient(circle at 50% 50%, rgba(255,200,0,0.25), transparent); animation-duration: 60s; }

/* ===== FLOATING STARS ===== */
.star {
    position: absolute;
    width: 3px; height: 3px;
    background: white;
    border-radius: 50%;
    opacity: 0.7;
    animation: floatUp linear infinite;
}
@keyframes floatUp { 100% { transform: translateY(-110vh); opacity: 0; } }

/* ===== FLOATING TEXT ===== */
.floating-text {
    position: absolute;
    font-size: 1.1em;
    pointer-events: none;
    z-index: 5;
    background: linear-gradient(45deg,#ffe600,#ffb300,#ff8a00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: floatText 18s linear infinite;
    opacity: 0;
}
@keyframes floatText {
    10% { opacity: 0.9; }
    50% { transform: translateY(-40px); opacity: 0.7; }
    100% { opacity: 0; transform: translateY(-60px); }
}

/* ===== BOUNCER ===== */
#bouncer {
    position: absolute;
    width: 120px;
    z-index: 20;
    cursor: grab;
    user-select: none;
    transition: transform 0.12s ease-out;
}
#bouncer:active { cursor: grabbing; }

.container {
    max-width: 800px;
    margin: 0 auto;
    text-align: center;
    z-index: 10;
    position: relative;
}
</style>
</head>

<body>

<!-- Galaxy -->
<div class="galaxy"></div>

<!-- Horizon Glow -->
<div class="horizon-glow"></div>

<!-- Asteroid Belt -->
<div class="asteroid-belt"></div>

<!-- Moons -->
<div class="moon moon1"></div>
<div class="moon moon2"></div>
<div class="moon moon3"></div>

<!-- Nebula -->
<div class="nebula n1"></div>
<div class="nebula n2"></div>
<div class="nebula n3"></div>

<!-- Music -->
<audio id="bgMusic" autoplay loop muted>
    <source src="dream-protocol-space-junk-ambient-soundscape-112876.mp3" type="audio/mpeg">
</audio>

<!-- Bouncer -->
<img id="bouncer" src="Untitled7_20260822213709.png">

<!-- Initial Floating Text -->
<div class="floating-text" style="left:10%;top:70%;">Relax among the stars...</div>
<div class="floating-text" style="left:70%;top:30%;animation-delay:6s;">Gravity is optional here.</div>
<div class="floating-text" style="left:40%;top:80%;animation-delay:12s;">Welcome, traveler.</div>

<div class="container">
    <h1 class="gradient-text neon">Welcome to The Star-Tailed!</h1>
    <p class="gradient-text neon">A cosmic place to relax...</p>
    <p class="gradient-text">Made by EnderCode7.</p>
    <button onclick="alert('You clicked me!')">Click Me</button>
</div>

<script>
/* Enable audio */
document.addEventListener("click", () => {
    const m = document.getElementById("bgMusic");
    m.muted = false;
    m.play();
}, { once: true });

/* Floating Stars */
setInterval(() => {
    const s = document.createElement("div");
    s.className = "star";
    s.style.left = Math.random()*100+"vw";
    s.style.top = Math.random()*100+"vh";
    s.style.animationDuration = (8+Math.random()*10)+"s";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),16000);
}, 500);

/* Floating Text */
const msgs = [
    "Relax among the stars...",
    "Gravity is optional here.",
    "Welcome, traveler.",
    "The cosmos is listening.",
    "Drift with the nebula...",
    "Your journey begins now.",
    "Silence is a superpower.",
    "The void is peaceful tonight.",
    "Dreams glow brighter in space.",
    "Follow the drifting lights...",
    "You are weightless here.",
    "Let the universe breathe."
];

function spawnText(){
    const t=document.createElement("div");
    t.className="floating-text";
    t.innerText=msgs[Math.floor(Math.random()*msgs.length)];
    t.style.left=Math.random()*80+"%";
    t.style.top=Math.random()*80+"%";
    t.style.animationDelay=(Math.random()*12)+"s";
    document.body.appendChild(t);
    setTimeout(()=>t.remove(),18000);
}
setInterval(spawnText,3000);
for(let i=0;i<5;i++)spawnText();

/* Bouncer Physics */
const img=document.getElementById("bouncer");
let x=200,y=200,dx=2.5,dy=2.5,drag=false,offX=0,offY=0,vx=0,vy=0;

img.addEventListener("dragstart",e=>e.preventDefault());

function squash(axis){
    img.style.transform = axis==="x" ? "scaleX(1.15) scaleY(0.9)" : "scaleX(0.9) scaleY(1.15)";
    setTimeout(()=>img.style.transform="scaleX(1) scaleY(1)",120);
}

function loop(){
    if(!drag){
        x+=dx; y+=dy;
        dx*=0.99; dy*=0.99;
        const w=innerWidth,h=innerHeight;
        if(x<=0||x+img.width>=w){dx*=-1; squash("x");}
        if(y<=0||y+img.height>=h){dy*=-1; squash("y");}
        img.style.left=x+"px";
        img.style.top=y+"px";
    }
    requestAnimationFrame(loop);
}
loop();

img.addEventListener("mousedown",e=>{
    drag=true;
    const r=img.getBoundingClientRect();
    offX=e.clientX-r.left;
    offY=e.clientY-r.top;
    dx=dy=0;
});
document.addEventListener("mousemove",e=>{
    if(drag){
        vx=e.movementX; vy=e.movementY;
        x=e.clientX-offX; y=e.clientY-offY;
        img.style.left=x+"px"; img.style.top=y+"px";
    }
});
document.addEventListener("mouseup",()=>{
    if(drag){ drag=false; dx=vx*1.1; dy=vy*1.1; }
});

/* Touch */
img.addEventListener("touchstart",e=>{
    drag=true;
    const t=e.touches[0],r=img.getBoundingClientRect();
    offX=t.clientX-r.left; offY=t.clientY-r.top;
    dx=dy=0;
});
img.addEventListener("touchmove",e=>{
    if(drag){
        const t=e.touches[0];
        vx=t.clientX-x; vy=t.clientY-y;
        x=t.clientX-offX; y=t.clientY-offY;
        img.style.left=x+"px"; img.style.top=y+"px";
    }
});
img.addEventListener("touchend",()=>{
    if(drag){ drag=false; dx=vx*0.4; dy=vy*0.4; }
});
</script>

</body>
</html>
