<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Tailed</title>

<style>
/* ===== BASE BACKGROUND (OLD COSMIC) ===== */
body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: #fff;
    overflow: hidden;
    background: linear-gradient(45deg, #0a0f3d, #1b004b);
    background-size: 200% 200%;
    animation: gradientMove 18s ease infinite;
}
@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* ===== GALAXY / NEBULA (OLD STYLE) ===== */
.galaxy-layer {
    position: fixed;
    top: 0;
    left: 0;
    width: 200%;
    height: 200%;
    background-repeat: no-repeat;
    background-size: cover;
    opacity: 0.15;
    pointer-events: none;
    animation: galaxyDrift 120s linear infinite;
    z-index: -3;
}
.galaxy-back {
    background-image:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.15), transparent 60%),
        radial-gradient(circle at 80% 70%, rgba(255,220,200,0.12), transparent 60%);
}
.galaxy-mid {
    background-image:
        radial-gradient(circle at 50% 20%, rgba(255,240,220,0.18), transparent 65%);
    animation-duration: 90s;
}
@keyframes galaxyDrift {
    from { transform: translate(-5%, -5%); }
    to { transform: translate(5%, 5%); }
}

.nebula-layer {
    position: fixed;
    top: 0;
    left: 0;
    width: 200%;
    height: 200%;
    background-repeat: no-repeat;
    background-size: cover;
    opacity: 0.25;
    pointer-events: none;
    animation: drift 80s linear infinite;
    z-index: -2;
}
.nebula-back {
    background-image: radial-gradient(circle at 30% 70%, rgba(255,150,0,0.35), transparent 60%);
    animation-duration: 110s;
}
.nebula-mid {
    background-image: radial-gradient(circle at 70% 40%, rgba(255,80,0,0.3), transparent 60%);
    animation-duration: 80s;
}
.nebula-front {
    background-image: radial-gradient(circle at 50% 50%, rgba(255,200,0,0.25), transparent 70%);
    animation-duration: 60s;
}
@keyframes drift {
    from { transform: translate(-6%, -6%); }
    to { transform: translate(6%, 6%); }
}

/* ===== TEXT EFFECTS ===== */
.gradient-text {
    background: linear-gradient(45deg, #ffe600, #ffb300, #ff8a00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-size: 200% 200%;
    animation: textGlow 6s ease infinite;
}
@keyframes textGlow {
    50% { background-position: 100% 50%; }
}
.neon {
    text-shadow:
        0 0 6px #ffdd55,
        0 0 12px #ffb300,
        0 0 24px #ff8a00,
        0 0 48px #ff8a00;
}

/* ===== FLOATING STARS ===== */
.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    opacity: 0.7;
    animation: floatUp linear infinite;
}
@keyframes floatUp {
    100% { transform: translateY(-110vh); opacity: 0; }
}

/* ===== COSMIC DUST ===== */
.dust {
    position: absolute;
    width: 2px;
    height: 2px;
    background: rgba(255,255,255,0.4);
    border-radius: 50%;
    opacity: 0.4;
    animation: dustDrift linear infinite;
    z-index: 0;
}
@keyframes dustDrift {
    100% { transform: translate(40px, -40px); opacity: 0.1; }
}

/* ===== SHOOTING STARS ===== */
.shooting-star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    box-shadow: 0 0 8px rgba(255,255,255,0.8);
    border-radius: 50%;
    opacity: 0.0;
    z-index: 1;
    animation: shoot linear forwards;
}
@keyframes shoot {
    10% { opacity: 0.8; }
    100% { opacity: 0; transform: translate(200px, -200px); }
}

/* ===== FLOATING TEXT ===== */
.floating-text {
    position: absolute;
    font-size: 1.1em;
    pointer-events: none;
    z-index: 5;
    background: linear-gradient(45deg, #ffe600, #ffb300, #ff8a00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: floatText 18s linear infinite;
    opacity: 0;
}
@keyframes floatText {
    10% { opacity: 0.9; }
    50% { transform: translateY(-40px); opacity: 0.7; }
    100% { opacity: 0; transform: translateY(-60px); }
}

/* ===== BOUNCER IMAGE ===== */
#bouncer {
    position: absolute;
    width: 120px;
    z-index: 20;
    cursor: grab;
    user-select: none;
    transition: transform 0.12s ease-out;
}
#bouncer:active { cursor: grabbing; }

/* ===== SINGLE 3D ORBIT MOON ===== */
#orbit-moon {
    position: fixed;
    bottom: 180px;
    left: 50%;
    width: 180px;
    height: 180px;
    background: radial-gradient(circle, #dcdcff, #6a6aff, #1a1a5f);
    border-radius: 50%;
    box-shadow: 0 0 40px rgba(120,120,255,0.4);
    transform: translateX(-50%);
    z-index: 3;
    pointer-events: none;
}

/* ===== BLACK HOLE EFFECT ===== */
.black-hole {
    position: fixed;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, black, #0a0a0a 40%, transparent 70%);
    box-shadow: 0 0 60px rgba(0,0,0,0.8);
    animation: blackHoleSpin 2.5s linear forwards;
    pointer-events: none;
    z-index: 999;
}
@keyframes blackHoleSpin {
    0% { transform: translate(-50%, -50%) scale(0.2) rotate(0deg); opacity: 0.8; }
    40% { transform: translate(-50%, -50%) scale(1.2) rotate(180deg); opacity: 1; }
    80% { transform: translate(-50%, -50%) scale(0.8) rotate(360deg); opacity: 0.7; }
    100% { transform: translate(-50%, -50%) scale(0.1) rotate(540deg); opacity: 0; }
}
body.blackhole-distort {
    filter: blur(2px) brightness(0.8);
    transition: filter 0.3s ease;
}

/* ===== CONTAINER ===== */
.container {
    max-width: 800px;
    margin: 0 auto;
    text-align: center;
    position: relative;
    z-index: 10;
}
</style>
</head>

<body>

<!-- Old Background Layers -->
<div class="galaxy-layer galaxy-back"></div>
<div class="galaxy-layer galaxy-mid"></div>

<div class="nebula-layer nebula-back"></div>
<div class="nebula-layer nebula-mid"></div>
<div class="nebula-layer nebula-front"></div>

<!-- Single 3D Orbit Moon -->
<div id="orbit-moon"></div>

<!-- Background Music -->
<audio id="bgMusic" autoplay loop muted>
    <source src="dream-protocol-space-junk-ambient-soundscape-112876.mp3" type="audio/mpeg">
</audio>

<!-- Throwable Image -->
<img id="bouncer" src="Untitled7_20260822213709.png">

<!-- Initial Floating Text -->
<div class="floating-text" style="left: 10%; top: 70%;">Relax among the stars...</div>
<div class="floating-text" style="left: 70%; top: 30%; animation-delay: 6s;">Gravity is optional here.</div>
<div class="floating-text" style="left: 40%; top: 80%; animation-delay: 12s;">Welcome, traveler.</div>

<div class="container">
    <h1 class="gradient-text neon">Welcome to The Star-Tailed!</h1>
    <p class="gradient-text neon">A cosmic place to relax...</p>
    <p class="gradient-text">Made by EnderCode7.</p>

    <!-- BLACK HOLE BUTTON -->
    <button onclick="spawnBlackHole()">Click Me</button>
</div>

<script>
/* Enable audio */
document.addEventListener("click", () => {
    const m = document.getElementById("bgMusic");
    m.muted = false;
    m.play();
}, { once: true });

/* Floating Stars */
setInterval(() => {
    const s = document.createElement("div");
    s.className = "star";
    s.style.left = Math.random()*100+"vw";
    s.style.top = Math.random()*100+"vh";
    s.style.animationDuration = (8+Math.random()*10)+"s";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),16000);
}, 500);

/* Cosmic Dust */
function createDust() {
    const d=document.createElement("div");
    d.className="dust";
    d.style.left=Math.random()*100+"vw";
    d.style.top=Math.random()*100+"vh";
    d.style.animationDuration=(20+Math.random()*20)+"s";
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),40000);
}
for(let i=0;i<40;i++)createDust();
setInterval(createDust,5000);

/* Shooting Stars */
setInterval(()=>{
    const s=document.createElement("div");
    s.className="shooting-star";
    s.style.left=Math.random()*innerWidth*0.8+"px";
    s.style.top=Math.random()*innerHeight*0.4+"px";
    s.style.animationDuration=(2+Math.random()*2)+"s";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),3000);
},8000);

/* Floating Text */
const msgs=[
    "Relax among the stars...",
    "Gravity is optional here.",
    "Welcome, traveler.",
    "The cosmos is listening.",
    "Drift with the nebula...",
    "Your journey begins now.",
    "Silence is a superpower.",
    "The void is peaceful tonight.",
    "Dreams glow brighter in space.",
    "Follow the drifting lights...",
    "You are weightless here.",
    "Let the universe breathe."
];
function spawnFloatingText(){
    const t=document.createElement("div");
    t.className="floating-text";
    t.innerText=msgs[Math.floor(Math.random()*msgs.length)];
    t.style.left=Math.random()*80+"%";
    t.style.top=Math.random()*80+"%";
    t.style.animationDelay=(Math.random()*12)+"s";
    document.body.appendChild(t);
    setTimeout(()=>t.remove(),18000);
}
setInterval(spawnFloatingText,3000);
for(let i=0;i<5;i++)spawnFloatingText();

/* Bouncer Physics */
const img=document.getElementById("bouncer");
let x=200,y=200,dx=2.5,dy=2.5,drag=false,offX=0,offY=0,vx=0,vy=0;

img.addEventListener("dragstart",e=>e.preventDefault());

function squash(axis){
    img.style.transform = axis==="x" ? "scaleX(1.15) scaleY(0.9)" : "scaleX(0.9) scaleY(1.15)";
    setTimeout(()=>img.style.transform="scaleX(1) scaleY(1)",120);
}

function loop(){
    if(!drag){
        x+=dx; y+=dy;
        dx*=0.99; dy*=0.99;
        const w=innerWidth,h=innerHeight;
        if(x<=0||x+img.width>=w){dx*=-1; squash("x");}
        if(y<=0||y+img.height>=h){dy*=-1; squash("y");}
        img.style.left=x+"px";
        img.style.top=y+"px";
    }
    requestAnimationFrame(loop);
}
loop();

img.addEventListener("mousedown",e=>{
    drag=true;
    const r=img.getBoundingClientRect();
    offX=e.clientX-r.left;
    offY=e.clientY-r.top;
    dx=dy=0;
});
document.addEventListener("mousemove",e=>{
    if(drag){
        vx=e.movementX; vy=e.movementY;
        x=e.clientX-offX; y=e.clientY-offY;
        img.style.left=x+"px"; img.style.top=y+"px";
    }
});
document.addEventListener("mouseup",()=>{
    if(drag){ drag=false; dx=vx*1.1; dy=vy*1.1; }
});

/* Touch */
img.addEventListener("touchstart",e=>{
    drag=true;
    const t=e.touches[0],r=img.getBoundingClientRect();
    offX=t.clientX-r.left; offY=t.clientY-r.top;
    dx=dy=0;
});
img.addEventListener("touchmove",e=>{
    if(drag){
        const t=e.touches[0];
        vx=t.clientX-x; vy=t.clientY-y;
        x=t.clientX-offX; y=t.clientY-offY;
        img.style.left=x+"px"; img.style.top=y+"px";
    }
});
img.addEventListener("touchend",()=>{
    if(drag){ drag=false; dx=vx*0.4; dy=vy*0.4; }
});

/* ===== BLACK HOLE BUTTON EFFECT ===== */
function spawnBlackHole() {
    document.body.classList.add("blackhole-distort");
    const hole=document.createElement("div");
    hole.className="black-hole";
    document.body.appendChild(hole);
    setTimeout(()=>{
        hole.remove();
        document.body.classList.remove("blackhole-distort");
    },2500);
}

/* ===== SINGLE MOON 3D ORBIT ===== */
const moon=document.getElementById("orbit-moon");
let angle=0;
function orbitMoon(){
    angle+=0.01;
    const radius=180;
    const xOff=Math.cos(angle)*radius;
    const yOff=Math.sin(angle)*(radius*0.4);
    const scale=0.7+(Math.sin(angle)*0.3);
    moon.style.transform=`
        translateX(calc(-50% + ${xOff}px))
        translateY(${yOff}px)
        scale(${scale})
    `;
    requestAnimationFrame(orbitMoon);
}
orbitMoon();
</script>

</body>
</html>
