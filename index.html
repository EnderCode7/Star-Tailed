<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Tailed</title>

    <style>
        /* Animated Gradient Background */
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #fff;
            overflow: hidden;
            background: linear-gradient(45deg, #C7A400, #FFE600, #FF8A00, #C75A00);
            background-size: 400% 400%;
            animation: gradientMove 12s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* PARALLAX NEBULA LAYERS */
        .nebula-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background-repeat: no-repeat;
            background-size: cover;
            opacity: 0.25;
            pointer-events: none;
            animation: drift 60s linear infinite;
        }

        .nebula-back {
            background-image: radial-gradient(circle at 30% 70%, rgba(255,150,0,0.4), transparent 60%);
            animation-duration: 90s;
        }

        .nebula-mid {
            background-image: radial-gradient(circle at 70% 40%, rgba(255,80,0,0.35), transparent 60%);
            animation-duration: 60s;
        }

        .nebula-front {
            background-image: radial-gradient(circle at 50% 50%, rgba(255,200,0,0.3), transparent 70%);
            animation-duration: 40s;
        }

        @keyframes drift {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(10%, 10%); }
        }

        /* Floating Stars */
        .star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(-120vh); opacity: 0; }
        }

        /* Neon Glow Text */
        .neon {
            color: #fff;
            text-shadow:
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #ffdd55,
                0 0 40px #ffdd55,
                0 0 80px #ffdd55;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 3.2em;
            margin: 20px 0;
        }

        p {
            font-size: 1.3em;
            margin: 15px 0;
        }

        button {
            background-color: #000;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 1.1em;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #764ba2;
            transform: scale(1.05);
        }

        /* Draggable + Throwable Image */
        #bouncer {
            position: absolute;
            width: 120px;
            height: auto;
            z-index: 20;
            cursor: grab;
        }
        #bouncer:active {
            cursor: grabbing;
        }
    </style>
</head>

<body>

    <!-- Parallax Nebula Layers -->
    <div class="nebula-layer nebula-back"></div>
    <div class="nebula-layer nebula-mid"></div>
    <div class="nebula-layer nebula-front"></div>

    <!-- Background Music -->
    <audio id="bgMusic" autoplay loop muted>
        <source src="your-music-file.mp3" type="audio/mpeg">
    </audio>

    <!-- Draggable + Throwable Image -->
    <img id="bouncer" src="your-image.png">

    <div class="container">
        <h1 class="neon">Welcome to The Star-Tailed!</h1>

        <p class="neon">A cosmic place to relax...</p>
        <p>Made by EnderCode7.</p>

        <button onclick="alert('You clicked me!')">Click Me</button>
    </div>

    <script>
        /* Enable audio after first user interaction */
        document.addEventListener("click", () => {
            const music = document.getElementById("bgMusic");
            music.muted = false;
            music.play();
        }, { once: true });

        /* Floating Stars */
        function createStar() {
            const star = document.createElement("div");
            star.classList.add("star");

            star.style.left = Math.random() * 100 + "vw";
            star.style.animationDuration = (4 + Math.random() * 6) + "s";

            const size = Math.random() * 3 + 2;
            star.style.width = size + "px";
            star.style.height = size + "px";

            star.style.top = Math.random() * 100 + "vh";

            document.body.appendChild(star);

            setTimeout(() => star.remove(), 10000);
        }

        setInterval(createStar, 200);

        /* Physics-Based Draggable + Throwable Image */
        const img = document.getElementById("bouncer");

        let x = 200, y = 200;
        let dx = 3, dy = 3;
        let dragging = false;
        let lastMouseX = 0, lastMouseY = 0;

        function physicsLoop() {
            if (!dragging) {
                x += dx;
                y += dy;

                dx *= 0.99;  // friction
                dy *= 0.99;

                const w = window.innerWidth;
                const h = window.innerHeight;

                if (x <= 0 || x + img.width >= w) dx *= -1;
                if (y <= 0 || y + img.height >= h) dy *= -1;

                img.style.left = x + "px";
                img.style.top = y + "px";
            }

            requestAnimationFrame(physicsLoop);
        }
        physicsLoop();

        img.addEventListener("mousedown", (e) => {
            dragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        document.addEventListener("mousemove", (e) => {
            if (dragging) {
                const mx = e.clientX;
                const my = e.clientY;

                dx = mx - lastMouseX;
                dy = my - lastMouseY;

                x = mx - img.width / 2;
                y = my - img.height / 2;

                img.style.left = x + "px";
                img.style.top = y + "px";

                lastMouseX = mx;
                lastMouseY = my;
            }
        });

        document.addEventListener("mouseup", () => {
            dragging = false;
        });
    </script>

</body>
</html>
