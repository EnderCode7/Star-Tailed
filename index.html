<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Tailed</title>

    <style>
        /* Animated Gradient Background */
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #fff;
            overflow: hidden;
            background: linear-gradient(45deg, #FF7300, #EAA130, #EFFF00, #f093fb, #764ba2);
            background-size: 400% 400%;
            animation: gradientMove 12s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Stars */
        .star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            from {
                transform: translateY(0);
                opacity: 1;
            }
            to {
                transform: translateY(-120vh);
                opacity: 0;
            }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 3.2em;
            margin: 20px 0;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
        }

        p {
            font-size: 1.3em;
            line-height: 1.6;
            margin: 15px 0;
        }

        button {
            background-color: #000;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 1.1em;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #764ba2;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome to The Star-Tailed!</h1>
        <p>Made by EnderCode7.</p>
        <p>I can put whatever dumb shit I want here.</p>

        <button onclick="alert('You clicked me!')">Click Me</button>
    </div>

    <script>
        // Create floating stars
        function createStar() {
            const star = document.createElement("div");
            star.classList.add("star");

            // Random horizontal position
            star.style.left = Math.random() * 100 + "vw";

            // Random animation duration
            star.style.animationDuration = (4 + Math.random() * 6) + "s";

            // Random size
            const size = Math.random() * 3 + 2;
            star.style.width = size + "px";
            star.style.height = size + "px";

            // Random starting vertical position
            star.style.top = Math.random() * 100 + "vh";

            document.body.appendChild(star);

            // Remove star after animation
            setTimeout(() => {
                star.remove();
            }, 10000);
        }

        // Spawn stars continuously
        setInterval(createStar, 200);
    </script>
</body>
</html>
